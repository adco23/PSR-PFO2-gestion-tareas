<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tareas</title>
</head>
<body>
  <h1>Bienvenido, {{ usuario }}!</h1>
  <p>Aqui puedes ver tus tareas.</p>
  {% if tareas %}
    <h2>Lista de Tareas:</h2>
    <ul>
      {% for tarea in tareas %}
        <li>{{ tarea }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No tienes tareas pendientes.</p>
  {% endif %}
  
</body>
</html>
